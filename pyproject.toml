[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "superpower-wiki-mcp"
version = "1.0.0"
description = "MCP server for Superpower Wiki (powerlisting.fandom.com) focused on character creation and power system worldbuilding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
superpower-wiki-mcp = "superpower_wiki_mcp.server:main"

[tool.setuptools.packages.find]
include = ["superpower_wiki_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
